name: Platform Stage

on:
  push:
    branches: [main]
  # allow trigger manually
  workflow_dispatch:

jobs:
  login-and-run-commands:
    name: Build and start on remote
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_STAGE }}
          username: ${{ secrets.USERNAME_STAGE }}
          passphrase: ${{ secrets.PASSPHRASE_STAGE }}
          key: ${{ secrets.KEY_STAGE }}
          port: ${{ secrets.PORT_STAGE }}
          script: |
            cd community-platform/
            git fetch --all
            git checkout main
            git reset --hard origin/main
            git clean -fd
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            nvm use
            rm -rf node_modules
            npm cache clean --force
            npm install
            npm run build
            pm2 restart community-platform
